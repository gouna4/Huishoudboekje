  if(act==='toonweg'){ui.toonWeg=!ui.toonWeg;render();return}

  if(act==='jaaropen'){ui.jaar=+periode(ui.per||0).van.slice(0,4);openJaar();return}
  if(act==='jaar'){ui.jaar+=+b.dataset.d;herteken();return}
  if(act==='printjaar'){
    /* op papier altijd de echte bedragen, ook als ze in de app verborgen zijn */
    var was=S.hide; S.hide=false; document.getElementById('print').innerHTML=jaarHtml(ui.jaar,true); S.hide=was;
    setTimeout(function(){window.print()},50); return;
  }
  if(act==='pinzet'){
    if(S.pin){vraag('Pincode weghalen?','Daarna opent de app weer zonder code.','Weghalen',function(){S.pin='';save();herteken()});return}
    pinBuf='';pinMode='nieuw1';pinFirst='';lockScreen('Pincode','Kies een code van vier cijfers');return;
  }
  if(act==='bkdeel'){
    markeerBackup(); render(); if(ui.sheet==='instellingen')herteken();
    var txt=backupTekst();
    try{var fl=new File([txt],backupNaam(),{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[fl]})){navigator.share({files:[fl],title:'Huishoudboek back-up'}).catch(function(){});return}}catch(er){}
    if(navigator.share){navigator.share({text:txt}).catch(function(){});return}
    downloadBackup(); return;
  }
  if(act==='bkfile'){markeerBackup();downloadBackup();render();herteken();return}
  if(act==='bkkopie'){markeerBackup();
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(backupTekst()).then(function(){b.textContent='Gekopieerd'},function(){});return}
  if(act==='pickfile'){document.getElementById('s_file').click();return}
  if(act==='import'){zetTerug(document.getElementById('s_import').value);return}
  if(act==='snap'){var sp=S.snaps[+b.dataset.i];if(sp)zetTerug(sp.data);return}
  if(act==='wisalles'){
    vraag('Alles wissen?','Alle vaste lasten, uitgaven en herstelpunten gaan weg van dit toestel. Maak eerst een back-up als je twijfelt. Dit kun je niet terugdraaien.','Alles wissen',function(){
      S.posten=[];S.uitgaven=[];S.snaps=[];S.tipsWeg={};S.lastBackup='';save();closeSheet();render()});return}
});
function downloadBackup(){
  var bl=new Blob([backupTekst()],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(bl);a.download=backupNaam();document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}

var inkTimer=null;
/* typen: live omrekenen en zelf een soort raden, zonder het veld te verstoren */
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='zoek'){ui.zoek=e.target.value;var pos=e.target.selectionStart;render();var z=document.getElementById('zoek');if(z){z.focus();try{z.setSelectionRange(pos,pos)}catch(er){}}return}
  if(id==='f_bedrag'){ui.draft.bedragTxt=e.target.value;var o=document.getElementById('f_omrek');if(o)o.innerHTML=omrekTekst();return}
  if(id==='f_naam'||id==='f_lev'){
    if(ui.draft.catHand)return;
    var n=document.getElementById('f_naam').value+' '+document.getElementById('f_lev').value, c=raadCat(n);
    if(c&&c!==ui.draft.cat){ui.draft.cat=c;var kk=document.querySelector('#sheet .catkeus');
      if(kk){kk.querySelector('.ico').outerHTML=ico(c);kk.querySelector('.t').textContent=CAT[c].n}}
    return;
  }
  if(id==='l_oms'){
    if(ui.draft.catHand)return;
    var c2=raadCat(e.target.value);
    if(c2&&c2!==ui.draft.cat){ui.draft.cat=c2;leesLosForm();var wasOpen=ui.catOpen;herteken();
      var el=document.getElementById('l_oms');if(el){el.focus();var L=el.value.length;el.setSelectionRange(L,L)}}
    return;
  }
  if(id==='f_afd'){ui.draft.afd=e.target.value;var sw=document.querySelector('[data-act=afvast] span');if(sw&&e.target.value)sw.textContent='Voortaan elke keer op de '+(+e.target.value.slice(8,10))+'e';return}
  if(id==='h_ink'){var bv=getal(e.target.value);S.hh.inkomen=bv>0?bv:0;if(bv>0)S.inkPer[periode(ui.per||0).van]=bv;save();clearTimeout(inkTimer);inkTimer=setTimeout(function(){var y=window.scrollY;render();window.scrollTo(0,y)},1200);return}
  if(id==='s_ink'){var v=getal(e.target.value);S.hh.inkomen=v>0?v:0;save();clearTimeout(inkTimer);inkTimer=setTimeout(function(){render()},900);return}
});

/* ───────────────────────────── start ───────────────────────────── */
load();
zetEigenCats();
if(!ui.maand)ui.maand=ym(today());
maakHerstelpunt();
if(!S.posten.length&&!S.uitgaven.length)ui.tab='overzicht';
render();
if(S.pin)opSlot();
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
