<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Huishoudboek</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Huishoudboek">
<meta name="theme-color" content="#111614">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Huishoudboek · v19 — broertje van het telefoonboek en het klusboek */
:root{
  --night:#111614; --surface:#1A201D; --surface2:#222A26; --line:#303A35;
  --sand:#EEF2EC; --dim:#97A39C; --faint:#6B7771;
  --accent:#43B98E;    /* knoppen, vaste lasten */
  --accent2:#7FA7E6;   /* losse uitgaven */
  --saffron:#E7AE45;   /* tips, besparen */
  --clay:#D0634F;      /* duurder geworden, weg */
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI Variable','Segoe UI',Roboto,'Helvetica Neue',sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Roboto Mono',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--night);color:var(--sand);font-family:var(--sans);
  font-size:16px;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{min-height:100vh}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:16px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dim{color:var(--dim)}
.wrap{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}

/* ── kop ── */
.top{position:sticky;top:0;z-index:20;background:var(--night);padding-top:env(safe-area-inset-top)}
.top-in{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 12px}
.title{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.sub{font-size:12px;color:var(--dim);margin-top:3px}
.knoppen{display:flex;gap:8px}
.icon-btn{width:44px;height:44px;background:var(--surface);border:1px solid var(--line);border-radius:13px;
  display:flex;align-items:center;justify-content:center;color:var(--sand)}
.icon-btn.on{border-color:var(--saffron);color:var(--saffron)}
.icon-btn svg{width:20px;height:20px}

/* ── onderbalk ── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(17,22,20,.96);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nav-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 9px;
  font-size:11px;font-weight:600;color:var(--faint);min-height:58px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--accent)}
.nav .badge{position:absolute;margin-left:20px;margin-top:-3px;background:var(--saffron);color:#1B1408;
  font-size:10px;font-weight:800;border-radius:99px;padding:1px 5px}
.nav .ic{position:relative;display:flex}

.fab{position:fixed;z-index:25;right:max(16px,calc(50% - 244px));bottom:calc(76px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:20px;background:var(--accent);color:#08140F;
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.95)}

/* ── blokken ── */
.hero{background:linear-gradient(155deg,#1E2A25,var(--surface));border:1px solid var(--line);border-radius:22px;
  padding:18px 18px 16px;margin-top:6px}
.hero .k{font-size:12px;color:var(--dim);font-weight:600}
.hero .v{font-family:var(--mono);font-size:40px;font-weight:650;letter-spacing:-.04em;margin-top:6px;line-height:1}
.hero .s{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--dim);margin-top:10px}
.hero .s b{color:var(--sand);font-family:var(--mono);font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--surface2);margin-top:14px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.meter.warn i{background:var(--saffron)}
.meter.te i{background:var(--clay)}
.meterlab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:6px}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:11px 11px 10px;text-align:left;min-width:0}
.kpi .k{font-size:11px;color:var(--dim);line-height:1.2;min-height:26px}
.kpi .v{font-family:var(--mono);font-size:15px;font-weight:650;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.h2 h2{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.h2 .r{font-size:12px;color:var(--dim)}
.h2 button.r{color:var(--accent);font-weight:600;font-size:13px;padding:6px 0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.card+.card{margin-top:10px}
.note{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:8px}
.leeg{padding:22px 18px;text-align:center;color:var(--dim);font-size:14px;line-height:1.5}

/* rij zoals op de bankapp: gekleurd rondje, naam, bedrag */
.rij{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left;min-height:62px}
.rij+.rij{border-top:1px solid var(--line)}
.rij:active{background:var(--surface2)}
.rij .t{flex:1;min-width:0}
.rij .n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rij .m{font-size:12px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rij .b{text-align:right;flex:0 0 auto}
.rij .b .a{font-family:var(--mono);font-size:15px;font-weight:600;white-space:nowrap}
.rij .b .p{font-size:11.5px;color:var(--dim);margin-top:2px;white-space:nowrap}
.rij.uit{opacity:.5}
.weg{flex:0 0 auto;width:46px;height:46px;border-radius:13px;border:1px solid rgba(208,99,79,.6);color:var(--clay);display:flex;align-items:center;justify-content:center}
.weg svg{width:20px;height:20px}
.up{color:var(--clay)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.af{background:rgba(67,185,142,.16);color:var(--accent)}
.tag.nog{background:rgba(127,167,230,.16);color:var(--accent2)}
.tag.stop{background:rgba(208,99,79,.16);color:var(--clay)}

.ico{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.ico svg{width:21px;height:21px}
.ico.s{width:32px;height:32px}.ico.s svg{width:17px;height:17px}

.groep{display:flex;align-items:center;justify-content:space-between;padding:0 4px;margin:20px 0 8px;
  font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.groep span:last-child{font-family:var(--mono);text-transform:none;letter-spacing:0}

/* ── balken per categorie ── */
.bars{padding:6px 14px 10px}
.bar{display:grid;grid-template-columns:32px 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;width:100%;text-align:left}
.bar .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .am{font-family:var(--mono);font-size:13.5px;font-weight:600;text-align:right;white-space:nowrap}
.bar .tr{grid-column:2 / 4;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.bar .pc{color:var(--dim);font-weight:400;font-size:12px;margin-left:6px}

/* ── maandgrafiek ── */
.chart{padding:14px 12px 10px}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:150px;align-items:end}
.col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;position:relative}
.col .stk{display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%}
.col .sv{background:var(--accent);border-radius:0 0 2px 2px}
.col .sl{background:var(--accent2);border-radius:4px 4px 0 0}
.col .sv:first-child{border-radius:4px 4px 2px 2px}
.col.dimmed .sv,.col.dimmed .sl{opacity:.45}
.col .tot{font-family:var(--mono);font-size:10px;color:var(--dim);text-align:center;margin-bottom:4px;white-space:nowrap}
.colx{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:6px}
.colx span{font-size:11.5px;color:var(--dim);text-align:center;text-transform:capitalize}
.colx span.on{color:var(--sand);font-weight:700}
.legend{display:flex;gap:16px;font-size:12px;color:var(--dim);margin:10px 4px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.mnav .mn{font-size:18px;font-weight:700;text-transform:capitalize}
.mnav .icon-btn{width:44px}
.drie{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

/* ── tips ── */
.tip{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px 15px 13px;margin-top:10px;position:relative}
.tip.hoog{border-color:rgba(231,174,69,.55)}
.tip .th{display:flex;gap:12px;align-items:flex-start}
.tip .tt{font-size:15px;font-weight:700;line-height:1.3}
.tip .tx{font-size:13.5px;line-height:1.55;color:#C9D2CC;margin-top:8px}
.tip .sv{display:inline-block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--saffron)}
.tip .ta{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tip .ta a,.tip .ta button{font-size:13px;font-weight:600;border-radius:10px;padding:9px 12px;
  background:var(--surface2);border:1px solid var(--line);color:var(--sand);text-decoration:none}
.tip .ta a{color:var(--accent)}
.bespaar{background:linear-gradient(155deg,#2A2616,var(--surface));border:1px solid rgba(231,174,69,.5);border-radius:22px;padding:18px;margin-top:6px}
.bespaar .k{font-size:12px;color:var(--saffron);font-weight:700}
.bespaar .v{font-family:var(--mono);font-size:34px;font-weight:650;letter-spacing:-.03em;margin-top:6px}
.bespaar .s{font-size:13px;color:var(--dim);margin-top:6px;line-height:1.45}
.toptip{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin-top:10px;
  background:linear-gradient(155deg,#2A2616,var(--surface));border:1px solid rgba(231,174,69,.5);border-radius:18px;padding:14px}
.toptip .t{flex:1;min-width:0}
.toptip .k{font-size:11.5px;color:var(--saffron);font-weight:700}
.toptip .n{font-size:14.5px;font-weight:600;margin-top:3px;line-height:1.3}

.melding{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface2);
  border:1px solid var(--saffron);border-radius:14px;padding:11px 12px;margin-top:4px;font-size:13px;line-height:1.4}
.melding button{flex:0 0 auto;background:var(--saffron);color:#1B1408;border-radius:10px;padding:9px 12px;font-weight:700;font-size:13px}
.flash{background:rgba(67,185,142,.14);border:1px solid rgba(67,185,142,.5);border-radius:14px;padding:11px 13px;margin-top:4px;font-size:13.5px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:9px 13px;font-size:13.5px;font-weight:600;color:var(--sand)}
.chip.on{background:var(--sand);color:var(--night);border-color:var(--sand)}
.chip.voorbeeld{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px}
.search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 14px;color:var(--sand)}
.zoekrij{display:flex;gap:8px;margin-top:6px}
.zoekrij .search{flex:1}

/* ── onderblad ── */
.sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:none;animation:fade .18s both}
.sheet-bg.open{display:block}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--night);border-top:1px solid var(--line);border-radius:22px 22px 0 0;
  padding:8px 0 calc(24px + env(safe-area-inset-bottom));display:none;animation:up .24s cubic-bezier(.2,.8,.2,1) both;overscroll-behavior:contain}
@supports (max-height:92dvh){.sheet{max-height:92dvh}}
.sheet.open{display:block}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sheet-in{max-width:520px;margin:0 auto;padding:0 18px}
.grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.shead h3{margin:0;font-size:19px;letter-spacing:-.01em}
.x{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.x svg{width:18px;height:18px}
.label{font-size:12px;font-weight:700;color:var(--dim);margin:16px 2px 7px;letter-spacing:.02em}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px 14px;color:var(--sand)}
textarea.field{min-height:74px;resize:vertical}
.field.groot{font-family:var(--mono);font-size:28px;font-weight:650;padding:12px 14px}
.eur{position:relative}
.eur .field{padding-left:38px}
.eur:before{content:'€';position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:18px;font-weight:600}
.eur.groot:before{font-size:26px}
.eur.groot .field{padding-left:44px}
.twee{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.omrek{font-size:13px;color:var(--dim);margin:8px 2px 0}
.omrek b{color:var(--sand);font-family:var(--mono)}
.catkeus{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:10px 12px;text-align:left}
.catkeus .t{flex:1;font-weight:600}
.catkeus .w{font-size:13px;color:var(--accent);font-weight:600}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 2px;border-radius:14px;border:1px solid transparent}
.catgrid button span{font-size:10.5px;line-height:1.2;text-align:center;color:var(--dim);max-width:100%}
.catgrid button.on{background:var(--surface);border-color:var(--accent)}
.catgrid button.on span{color:var(--sand);font-weight:600}
.btn{display:block;width:100%;background:var(--accent);color:#08140F;border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:20px;text-align:center}
.btn.outline{background:var(--surface);color:var(--sand);border:1px solid var(--line);margin-top:10px;font-weight:600}
.btn.rood{background:none;border:1px solid rgba(208,99,79,.6);color:var(--clay);margin-top:10px;font-weight:600}
.btn.klein{padding:12px;font-size:14.5px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px}
.stepper .sl{font-weight:600;font-size:15px}
.stepper .sc{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:11px;background:var(--surface2);font-size:22px;font-weight:600}
.stepper .sn{min-width:28px;text-align:center;font-family:var(--mono);font-size:18px;font-weight:700}
.stepper+.stepper{margin-top:8px}
.schakel{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;text-align:left;font-weight:600}
.schakel i{flex:0 0 auto;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.schakel i:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sand);transition:transform .15s}
.schakel.on i{background:var(--accent)}
.schakel.on i:after{transform:translateX(18px)}
.hist{font-size:13px;line-height:1.7;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 14px}
.hist div{display:flex;justify-content:space-between}
.hist .mono{font-weight:600}
.divider{height:1px;background:var(--line);margin:22px 0 4px}
.versie{text-align:center;color:var(--faint);font-size:12px;margin-top:22px}

.nav-in{grid-template-columns:repeat(5,1fr)}
.nav button{font-size:10.5px;padding-left:2px;padding-right:2px}

/* ── budget ── */
.pot{padding:13px 14px}
.pot+.pot{border-top:1px solid var(--line)}
.pot .ph{display:flex;align-items:center;gap:11px}
.pot .pn{flex:1;min-width:0}
.pot .pn b{display:block;font-size:14.5px}
.pot .pn span{font-size:12px;color:var(--dim)}
.pot .pv{text-align:right;font-family:var(--mono);font-size:14px;font-weight:650;white-space:nowrap}
.pot .pv small{display:block;font-family:var(--sans);font-size:11.5px;font-weight:500;color:var(--dim);margin-top:2px}
.ptrack{position:relative;height:10px;border-radius:99px;background:var(--surface2);margin-top:10px}
.ptrack i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent)}
.ptrack i.warn{background:var(--saffron)}
.ptrack i.te{background:var(--clay)}
.ptrack em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--sand);border-radius:2px}
.pst{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-top:7px;color:var(--dim)}
.pst .ok{color:var(--accent);font-weight:700}.pst .wa{color:var(--saffron);font-weight:700}.pst .te{color:var(--clay);font-weight:700}
.drie2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.regel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.regel .k{font-size:11.5px;color:var(--dim);line-height:1.3}
.regel .v{font-family:var(--mono);font-size:18px;font-weight:650;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.regel .s{font-size:11.5px;color:var(--dim);margin-top:3px}

/* ── thuis ── */
.thuiskop{display:flex;justify-content:space-between;align-items:flex-end;margin-top:4px}
.thuiskop .mn{font-size:20px;font-weight:700}
.inkblok{margin-top:12px}
.inkblok label{display:block;font-size:12px;font-weight:700;color:var(--dim);margin:0 2px 6px}
.pijlers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pijler{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.pijler:active{background:var(--surface2)}
.pijler .pn{font-size:15px;font-weight:700;margin-top:8px}
.pijler .pb{font-family:var(--mono);font-size:13.5px;font-weight:650;margin-top:3px;white-space:nowrap}
.pijler .pb span{color:var(--dim);font-weight:500}
.pijler .pr{font-size:12px;font-weight:700;margin-top:5px;color:var(--accent)}
.pijler .pr.warn{color:var(--saffron)}.pijler .pr.te{color:var(--clay)}
.pijler .pp{font-size:11px;color:var(--faint);margin-top:3px}
.ring{position:relative;flex:0 0 auto}
.ring svg{display:block}
.ring .rv{stroke:var(--accent);transition:stroke-dasharray .5s}
.ring.warn .rv{stroke:var(--saffron)}
.ring.te .rv{stroke:var(--clay)}
.ring .ri{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ri b{font-family:var(--mono);font-size:20px;font-weight:700;line-height:1.1}
.ring .ri .ric{color:var(--dim);display:flex;margin-bottom:2px}
.ring .ri .ric svg{width:18px;height:18px}
.groring{display:flex;justify-content:center;margin:8px 0 6px}
.groring .ri b{font-size:38px}
.groring .ri span{font-size:12.5px;color:var(--dim);margin-top:4px}
.schuifkaart{padding:12px 14px;margin-top:10px}
.schuifkaart .k{font-size:12px;font-weight:700;color:var(--saffron);margin-bottom:6px}
.schuifkaart .sr{font-size:13.5px;line-height:1.7}
.homebtn{margin-right:10px}
.homebtn.on{border-color:var(--accent);color:var(--accent)}
.kopl{display:flex;align-items:center}

/* ── jaaroverzicht ── */
.tabel{width:100%;border-collapse:collapse;font-size:13px}
.tabel th{text-align:left;font-size:11px;color:var(--dim);font-weight:700;padding:7px 6px;border-bottom:1px solid var(--line)}
.tabel td{padding:8px 6px;border-bottom:1px solid var(--line)}
.tabel .r{text-align:right;font-family:var(--mono);white-space:nowrap}
.tabel tr.som td{font-weight:700;border-bottom:0}
.tabel tr.toek td{color:var(--faint)}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  #app,#sheet,#sheetbg,#vraag,#lock{display:none!important}
  #print{display:block;font-family:var(--sans);color:#000;padding:0 4mm}
  #print h1{font-size:20pt;margin:0 0 2mm}
  #print h2{font-size:13pt;margin:8mm 0 2mm}
  #print .sub{color:#555;font-size:10pt}
  #print table{width:100%;border-collapse:collapse;font-size:10pt}
  #print th{text-align:left;border-bottom:1.5px solid #000;padding:3px 4px;font-size:9pt}
  #print td{border-bottom:1px solid #ccc;padding:3px 4px}
  #print .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  #print tr.som td{font-weight:700;border-top:1.5px solid #000;border-bottom:0}
  #print tr.toek td{color:#888}
  #print .kpi3{display:flex;gap:8mm;margin-top:4mm}
  #print .kpi3 div{font-size:9pt;color:#555}
  #print .kpi3 b{display:block;font-size:14pt;color:#000}
  @page{margin:14mm}
}

/* ── slot ── */
.lockscreen{position:fixed;inset:0;z-index:70;background:var(--night);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom))}
.lockscreen .lg{font-size:26px;font-weight:700;letter-spacing:-.02em}
.lockscreen .ls{font-size:13px;color:var(--dim);margin-top:8px;text-align:center;line-height:1.5}
.dots{display:flex;gap:14px;margin:32px 0 8px;height:16px;align-items:center}
.dot{width:13px;height:13px;border-radius:50%;border:1px solid var(--line);transition:all .15s}
.dot.on{background:var(--accent);border-color:var(--accent);transform:scale(1.1)}
.dots.bad .dot{border-color:var(--clay);background:var(--clay)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:26px}
.key{height:76px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--sand);
  font-size:26px;font-weight:500;font-family:var(--mono);display:flex;align-items:center;justify-content:center}
.key:active{background:var(--surface2)}
.key.wide{font-size:14px;font-weight:600;border-color:transparent;background:transparent;color:var(--dim);font-family:var(--sans)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

.vraag-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px}
.vraag{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:380px;width:100%}
.vraag h4{margin:0;font-size:17px}
.vraag p{font-size:14px;color:var(--dim);line-height:1.5;margin:10px 0 0}
.vraag .twee{margin-top:18px}
.vraag .btn{margin:0}
</style>
</head>

/* bedrag dat op een bepaalde dag gold: de laatste prijs van vóór die dag */
function bedragOp(p,d){
  var h=p.hist&&p.hist.length?p.hist:[{d:p.start||today(),b:p.bedrag}];
  var b=h[0].b;
  for(var i=0;i<h.length;i++)if(h[i].d<=d)b=h[i].b;

}

/* Een tijdelijke vaste last (p.aantal keer) houdt na de laatste keer vanzelf op.
   Dit loopt de geplande dagen af zonder keren() te gebruiken. */
var tijdCache={};
function tijdelijkInfo(p){
  if(!p.aantal||!p.start)return null;
  var sleutel=p.id+'|'+p.start+'|'+p.freq+'|'+p.aantal+'|'+(p.maanden||[]).join(',');
  if(tijdCache[sleutel])return tijdCache[sleutel];
  var f=FR[p.freq]||FR.maand, s0=dag(p.start), dagen=[], i=0;
  while(dagen.length<p.aantal&&i<2000){
    var dd;
    if(f.d)dd=new Date(s0.getFullYear(),s0.getMonth(),s0.getDate()+i*f.d);
    else{
      var mm=s0.getMonth()+i, dim=new Date(s0.getFullYear(),mm+1,0).getDate();
      dd=new Date(s0.getFullYear(),mm,Math.min(s0.getDate(),dim));
      if(i%f.m!==0||(p.freq==='maand'&&p.maanden&&p.maanden.length&&p.maanden.indexOf(dd.getMonth()+1)<0)){i++;continue}
    }
    dagen.push(iso(dd)); i++;
  }
  return tijdCache[sleutel]={eerste:dagen[0],laatste:dagen[dagen.length-1],dagen:dagen};
}
function tijdelijkStand(p){
  var ti=tijdelijkInfo(p); if(!ti)return null;
  var t=today(), gedaan=ti.dagen.filter(function(pl){return echteDag(p,pl)<=t}).length;
  return {gedaan:gedaan,totaal:ti.dagen.length,nog:ti.dagen.length-gedaan,laatste:echteDag(p,ti.laatste)};
}
function actief(p){
  if(p.gestopt&&p.gestopt<=today())return false;
  var ti=tijdelijkInfo(p);
  return !(ti&&echteDag(p,ti.laatste)<today());
}

/* op welke dagen in maand k (JJJJ-MM) wordt deze post afgeschreven */
function keren(p,k){
  var f=FR[p.freq]||FR.maand; if(!p.start)return [];
  var s=dag(p.start), y=+k.slice(0,4), m=+k.slice(5,7)-1, res=[];
  var m0=new Date(y,m,1), m1=new Date(y,m+1,0);
  if(f.d){
    var diff=Math.round((m0-s)/86400000), n=diff>0?Math.ceil(diff/f.d):0;
    var dd=new Date(s.getFullYear(),s.getMonth(),s.getDate()+n*f.d);
    while(dd<=m1){ if(dd>=m0)res.push(iso(dd)); dd=new Date(dd.getFullYear(),dd.getMonth(),dd.getDate()+f.d); }
  }else{
    var md=(y*12+m)-(s.getFullYear()*12+s.getMonth());
    if(p.freq==='maand'&&p.maanden&&p.maanden.length&&p.maanden.indexOf(m+1)<0)md=-1;
    if(md>=0&&md%f.m===0)res.push(iso(new Date(y,m,Math.min(s.getDate(),m1.getDate()))));
  }
  var ti=tijdelijkInfo(p);
  return res.filter(function(d){return (!p.gestopt||d<p.gestopt)&&(!ti||d<=ti.laatste)});
}
/* Valt een afschrijving in het weekend, dan gaat het geld meestal de vrijdag
   ervoor of de maandag erna. Heb je zelf gezegd wanneer hij echt afging
   (p.afw), dan telt die dag. keren() geeft de geplande dag, dit de echte. */
function schuifWeekend(d){
  var r=S.hh.vastWeekend||'voor'; if(r==='geen')return d;
  var x=dag(d),w=x.getDay(); if(w!==0&&w!==6)return d;
  var n=r==='voor'?(w===6?-1:-2):(w===6?2:1);
  return iso(new Date(x.getFullYear(),x.getMonth(),x.getDate()+n));
}
function echteDag(p,pl){return (p.afw&&p.afw[pl])||((FR[p.freq]||FR.maand).d?pl:schuifWeekend(pl))}
function afschrijvingen(p,van,tot){
  var out=[],k=schuifMaand(ym(van),-1),eind=schuifMaand(ym(tot),1);
  while(k<=eind){
    keren(p,k).forEach(function(pl){var d=echteDag(p,pl);if(d>=van&&d<=tot)out.push({pl:pl,d:d,b:bedragOp(p,pl)})});
    k=schuifMaand(k,1);
  }
  return out.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
}

  if(net>55&&!bewust('internet'))add({id:'internet',cat:'internet',hoog:net>70,
    t:'Internet en tv kan goedkoper',
    x:'Je betaalt '+eur(net,1)+' per maand. Alleen internet, zonder tv-pakket, kost vaak €35 tot €45; tv kijk je dan via apps. Loopt je contract al een jaar? Bel je provider en zeg dat je wilt opzeggen: dan bieden ze vaak korting aan om je te houden.',
    s:(net-45)*12, l:L.internet});

  /* mobiel */
  var duur=posten('mobiel').filter(function(p){return perMaand(p)>20});
  if(duur.length){var sm=0;duur.forEach(function(p){sm+=perMaand(p)-12});
    add({id:'mobiel',cat:'mobiel',hoog:true,
      t:duur.length===1?duur[0].naam+' is een duur abonnement':duur.length+' dure telefoonabonnementen',
      x:'Sim-only bij een budgetaanbieder kost vaak €8 tot €15 per maand voor ruim genoeg data. Heb je een toestel meegekregen en is dat al afbetaald? Dan betaal je dat nog steeds mee als je niets verandert. Zet het abonnement om naar sim-only of stap over; je nummer neem je mee.',
      s:sm*12, l:L.mobiel});}

  /* zorgverzekering */
  /* 2026: basis gemiddeld ± €159, met aanvullend en tandarts al snel €190 tot €230 */
  var z=tot('zorgverz'), zRef=A*210;
  if(z>A*240&&!bewust('zorgverz'))add({id:'zorg',cat:'zorgverz',hoog:true,
    t:'Je zorgverzekering is duur voor '+A+(A===1?' volwassene':' volwassenen'),
    x:'Kinderen tot 18 zijn gratis meeverzekerd. Kijk welke aanvullende verzekering je echt gebruikt: veel mensen betalen voor tandarts of fysio die ze nauwelijks nodig hebben. Een basisverzekering met budgetpolis is vaak goedkoper, maar dan kies je minder vrij je zorgverlener.',
    s:(z-zRef)*12, l:L.zorg});
  if(maand>=10)add({id:'zorg-overstap-'+new Date().getFullYear(),cat:'zorgverz',hoog:true,
    t:'Nu is het overstapseizoen voor je zorgverzekering',
    x:'Opzeggen kan tot en met 31 december, en bij de nieuwe verzekeraar afsluiten tot 1 februari. De nieuwe verzekeraar zegt je oude meestal voor je op. De nieuwe premies zijn half november bekend.',s:0,l:L.zorg});
  else if(maand>=8&&posten('zorgverz').length)add({id:'zorg-agenda-'+new Date().getFullYear(),cat:'zorgverz',
    t:'Zet half november in je agenda',
    x:'Dan maken de verzekeraars de premies voor volgend jaar bekend. Tot 31 december kun je opzeggen en overstappen.',s:0});

  /* verzekeringen */
  var vz=posten('verzek');
  if(vz.length>=3)add({id:'verzek-dubbel',cat:'verzek',
    t:'Loop je '+vz.length+' verzekeringen na op dubbele dekking',
    x:'Veel gezien: een reisverzekering én een annulering via je creditcard, rechtsbijstand die je al via werk of vakbond hebt, of pechhulp die al bij je autoverzekering zit. Alles bij één verzekeraar onderbrengen geeft vaak pakketkorting.',
    s:tot('verzek')*12*.1, l:L.verzek});
  var maandBetaald=vz.concat(posten('auto')).filter(function(p){return p.freq==='maand'&&/verzek|polis|wa|allrisk|casco/i.test(p.naam+' '+(p.lev||''))||p.cat==='verzek'&&p.freq==='maand'});
  if(maandBetaald.length>=2){var mb=0;maandBetaald.forEach(function(p){mb+=perMaand(p)});
    add({id:'verzek-jaar',cat:'verzek',
      t:'Per jaar betalen is soms goedkoper',
      x:'Je betaalt '+maandBetaald.length+' verzekeringen per maand. Sommige verzekeraars rekenen een toeslag voor maandbetaling, of geven korting als je per jaar betaalt. Vraag het na bij de volgende verlenging.',
      s:mb*12*.02});}
  if(S.posten.some(function(p){return actief(p)&&/allrisk|all risk|casco/i.test(p.naam)}))add({id:'auto-wa',cat:'auto',
    t:'Is allrisk nog nodig voor je auto?',
    x:'Is je auto ouder dan een jaar of zes, of minder dan zo\'n €6.000 waard, dan is WA of WA-plus vaak genoeg. Het verschil in premie is dan meestal groter dan wat je bij schade terugkrijgt.',s:0,l:L.verzek});

  /* boodschappen */
  var bRef=A*290+K*190, b=tot('boodsch');
  if(b>bRef*1.1)add({id:'boodsch',cat:'boodsch',hoog:b>bRef*1.3,
    t:'Aan boodschappen geef je meer uit dan gemiddeld',
    x:'Ongeveer '+eur(b,1)+' per maand, terwijl zo\'n huishouden het met ongeveer '+eur(bRef,1)+' redt. Wat het meeste scheelt: huismerk in plaats van A-merk, een weekmenu met een boodschappenlijst, één keer per week groot boodschappen doen, en de basis halen bij Lidl of Aldi. Dat scheelt al snel 15 tot 25 procent.',
    s:(b-bRef)*12, l:L.nibud});
  else if(!b&&S.posten.length>=3)add({id:'boodsch-bijhouden',cat:'boodsch',
    t:'Houd je boodschappen een maand bij',
    x:'Boodschappen zijn voor de meeste huishoudens de grootste post na de huur, en het bedrag waar je het makkelijkst op bespaart. Zet elke kassabon bij Uitgaven, of vul bij Vaste lasten een bedrag per week in. Daarna kan de app vergelijken.',s:0});

  /* streaming */
  var st=posten('streaming');
  if(st.length>=2||tot('streaming')>25){
    var max=0,som=0;st.forEach(function(p){var v=perMaand(p);som+=v;if(v>max)max=v});
    add({id:'streaming',cat:'streaming',
      t:st.length+' abonnementen voor streaming en meer',
      x:'Samen '+eur(som)+' per maand. Neem er één tegelijk en wissel per maand: een serie kijk je toch achter elkaar uit. Kijk ook of er al een bij je internet- of mobiel abonnement zit, en of je een familie-account kunt delen binnen je huishouden.',
      s:Math.max(0,som-max)*12*.7});
  }
  var maandAbo=S.posten.filter(function(p){return actief(p)&&p.freq==='maand'&&['streaming','sport','overig'].indexOf(p.cat)>=0});
  if(maandAbo.length>=6)add({id:'abo-na',cat:'overig',
    t:'Je hebt '+maandAbo.length+' kleine maandabonnementen',
    x:'Die tikken ongemerkt aan. Loop ze één voor één langs: gebruik ik dit elke week? Zo niet, zeg op. Opzeggen kan sinds 2023 ook online met een opzegknop.',s:0});

  /* sport */
  var sp=tot('sport');
  if(sp>Pn*35&&!bewust('sport'))add({id:'sport',cat:'sport',
    t:'Sporten kan goedkoper',
    x:'Je betaalt '+eur(sp,1)+' per maand. Budgetsportscholen zitten rond €20 tot €30. Ga je minder dan één keer per week, dan is een strippenkaart of losse les vaak goedkoper dan een abonnement.',
    s:(sp-Pn*25)*12});

  /* uit eten */
  var ue=tot('uiteten');
  if(ue>Pn*60)add({id:'uiteten',cat:'uiteten',
    t:'Veel geld naar bezorgen en uit eten',
    x:'Ongeveer '+eur(ue,1)+' per maand. Bezorgen is de duurste manier van eten: je betaalt bezorgkosten, servicekosten en een hogere prijs. Kook een paar keer per week dubbel en vries de helft in, dan heb je op drukke avonden ook iets snels.',
    s:(ue-Pn*60)*12*.5});

  /* brandstof */
  var bs=tot('brandstof');
  if(bs>150)add({id:'brandstof',cat:'brandstof',
    t:'Tanken: een paar kleine dingen schelen veel',
    x:'Tank niet langs de snelweg, dat is vaak 15 tot 25 cent per liter duurder. Een app met de goedkoopste pomp in de buurt helpt. Houd je banden op spanning en rijd op de snelweg 100 in plaats van 130.',
    s:bs*12*.08});

  /* leningen */
  var le=posten('lening');
  if(le.length)add({id:'lening',cat:'lening',hoog:true,
    t:'Los de duurste lening als eerste af',
    x:'Heb je meerdere leningen, betaal dan het minimum op alles en de rest op die met de hoogste rente. Rood staan, een creditcard en achteraf betalen zijn het duurst. Kom je er niet uit? Bij het Geldloket of de schuldhulp van je gemeente is hulp gratis.',
    s:0, l:[{l:'Geldfit',u:'https://www.geldfit.nl'}]});

  /* contracten die aflopen */
  S.posten.forEach(function(p){
    if(!actief(p)||!p.eind||p.bewust)return;
    var n=dagenTot(p.eind);
    if(n<=60&&n>=-30)add({id:'eind-'+p.id+'-'+p.eind,cat:p.cat,hoog:true,post:p.id,
      t:n<0?'Het contract van '+p.naam+' is afgelopen':'Het contract van '+p.naam+' loopt '+(n===0?'vandaag':'over '+n+' dagen')+' af',
      x:'Vergelijk nu, en zeg op tijd op als je iets beters vindt. Doe je niets, dan loopt het meestal gewoon door, vaak tegen een hoger tarief. Vraag je huidige '+(p.lev||'leverancier')+' ook wat ze je bieden om te blijven.',
      s:perMaand(p)*12*.1, l:L[{energie:'energie',internet:'internet',mobiel:'mobiel',zorgverz:'zorg',verzek:'verzek'}[p.cat]]});
  });

  /* duurder geworden */
  S.posten.forEach(function(p){
    if(!actief(p)||p.bewust||!p.hist||p.hist.length<2)return;
    var eerst=p.hist[0].b, nu=p.bedrag;
    if(eerst>0&&nu>eerst*1.08)add({id:'duurder-'+p.id+'-'+nu,cat:p.cat,post:p.id,
      t:p.naam+' is '+Math.round((nu/eerst-1)*100)+'% duurder geworden',
      x:'Van '+eur(eerst)+' naar '+eur(nu)+' '+FR[p.freq].k+', sinds '+datum(p.hist[0].d,1)+'. Een prijsverhoging geeft je vaak het recht om meteen op te zeggen. Bel en vraag om een beter aanbod, of kijk wat het elders kost.',
      s:(nu-eerst)*FR[p.freq].f*12});
  });

  /* inkomen */
  var ink=+S.hh.inkomen||0;
  if(ink>0){
    var deel=vp.tot/ink;
    if(deel>.6)add({id:'deel-hoog',cat:'wonen',hoog:true,
      t:'Je vaste lasten zijn '+Math.round(deel*100)+'% van je inkomen',
      x:'Blijft er na je vaste lasten weinig over, dan is elke onverwachte rekening een probleem. Begin bij de grootste posten hierboven. Het Nibud heeft een gratis budgetplanner als je samen met iemand wilt kijken.',s:0,l:L.nibud});
    var grens=A>1?4300:3300;
    if(ink<grens)add({id:'toeslagen',cat:'belasting',hoog:true,
      t:'Check of je recht hebt op toeslagen',
      x:'Met dit inkomen heb je mogelijk recht op zorgtoeslag'+(S.hh.woning==='huur'?', huurtoeslag':'')+(K?' of kindgebonden budget':'')+'. Dat hangt ook af van je vermogen en je precieze inkomen, dus doe even de proefberekening. Bij een laag inkomen kun je bij je gemeente ook kwijtschelding van gemeentebelasting aanvragen.',
      s:0,l:L.toeslag});
    if(!tot('sparen')&&vp.tot<ink*.9)add({id:'sparen',cat:'sparen',
      t:'Betaal jezelf eerst',
      x:'Zet een automatische spaaropdracht op de dag na je salaris. Wat je niet ziet, geef je niet uit. Zelfs €25 per maand is €300 per jaar, en een buffer voorkomt dat je moet lenen als de wasmachine kapotgaat.',s:0});
  }

  /* staat er voor dezelfde soort al een tip met een besparing, dan telt de
     prijsstijging niet nog een keer mee in het totaal */
  out.forEach(function(t){
    if(t.id.indexOf('duurder-')===0&&out.some(function(o){return o!==t&&o.cat===t.cat&&o.id.indexOf('duurder-')!==0&&o.s>0}))t.s=0;
  });
  out.forEach(function(t){t.s=Math.max(0,Math.round(t.s||0))});
  out.sort(function(a,b){return (b.weg?-1:0)-(a.weg?-1:0)||(b.s-a.s)||((b.hoog?1:0)-(a.hoog?1:0))});
  return out;
}

/* ───────────────────────────── tekenen ───────────────────────────── */
var TABS=[{id:'overzicht',n:'Overzicht',i:'overzicht'},{id:'vast',n:'Vaste lasten',i:'herhaal'},
          {id:'uitgaven',n:'Uitgaven',i:'bon'},{id:'vervoer',n:'Tanken',i:'pomp'},{id:'besparen',n:'Besparen',i:'lamp'}];

function render(){
  var h='<header class="top"><div class="top-in"><div class="kopl"><button class="icon-btn homebtn'+(ui.tab==='home'?' on':'')+'" data-act="thuis" aria-label="Thuis">'+svg(P.huis)+'</button><div><div class="title">Huishoudboek</div>'
    + '<div class="sub">'+esc(S.hh.volw)+(+S.hh.volw===1?' volwassene':' volwassenen')+(+S.hh.kind?' · '+S.hh.kind+(+S.hh.kind===1?' kind':' kinderen'):'')+' · v'+VERSIE+'</div></div></div>'
    + '<div class="knoppen"><button class="icon-btn'+(S.hideInk?' on':'')+'" data-act="hideink" aria-label="Inkomen verbergen" title="Inkomen verbergen">'+svg(P[S.hideInk?'oogdicht':'oog'])+'</button>'
    + '<button class="icon-btn" data-act="instellingen" aria-label="Instellingen">'+svg(P.tandwiel)+'</button></div></div></header>';
  h+='<main class="wrap">';
  if(ui.msg){h+='<div class="flash">'+esc(ui.msg)+'</div>';ui.msg=''}
  h+=({home:vHome,overzicht:vOverzicht,vast:vVast,uitgaven:vUitgaven,vervoer:vVervoer,besparen:vBesparen}[ui.tab]||vHome)();
  h+='</main>';
  if(ui.tab==='vast'||ui.tab==='uitgaven'||ui.tab==='overzicht'||ui.tab==='vervoer'||(ui.tab==='home'&&+S.hh.inkomen))
    h+='<button class="fab" data-act="'+(ui.tab==='uitgaven'||ui.tab==='vervoer'||ui.tab==='home'?'nieuwlos':'nieuwpost')+'"'+(ui.tab==='vervoer'?' data-cat="brandstof"':'')+' aria-label="Toevoegen">'+svg(P.plus)+'</button>';
  var nt=tips().filter(function(t){return t.hoog}).length;
  h+='<nav class="nav"><div class="nav-in">';
  TABS.forEach(function(t){
    h+='<button class="'+(ui.tab===t.id?'on':'')+'" data-act="tab" data-v="'+t.id+'"><span class="ic">'+svg(P[t.i])
      + (t.id==='besparen'&&nt?'<span class="badge">'+nt+'</span>':'')+'</span>'+t.n+'</button>';
  });
  h+='</div></nav>';
  document.getElementById('app').innerHTML=h;
}

function backupMelding(){
  if(!S.posten.length&&!S.uitgaven.length)return '';
  var n=S.lastBackup?-dagenTot(S.lastBackup):999;
  if(n<14)return '';
  return '<div class="melding"><div>'+(S.lastBackup?'Je laatste back-up is van '+n+' dagen geleden.':'Je hebt nog nooit een back-up gemaakt.')+'</div>'
    + '<button data-act="bkdeel">Nu maken</button></div>';
}

function huishoudenBlok(){
  return '<div class="stepper"><span class="sl">Volwassenen</span><span class="sc"><button data-act="hh" data-k="volw" data-d="-1">−</button><span class="sn">'+S.hh.volw+'</span><button data-act="hh" data-k="volw" data-d="1">+</button></span></div>'
    + '<div class="stepper"><span class="sl">Kinderen</span><span class="sc"><button data-act="hh" data-k="kind" data-d="-1">−</button><span class="sn">'+S.hh.kind+'</span><button data-act="hh" data-k="kind" data-d="1">+</button></span></div>'
    + '<div class="label">Woning</div><div class="chips">'
    + ['huur','koop'].map(function(w){return '<button class="chip'+(S.hh.woning===w?' on':'')+'" data-act="woning" data-v="'+w+'">'+(w==='huur'?'Huurhuis':'Koophuis')+'</button>'}).join('')
    + '</div>';
}

function vOverzicht(){
  var h=backupMelding();
  if(!S.posten.length&&!S.uitgaven.length){
    h+='<div class="hero"><div class="k">Welkom</div><div style="font-size:22px;font-weight:700;margin-top:8px;line-height:1.25">Wat kost jouw huishouden per maand?</div>'
      + '<div class="note" style="font-size:14px">Zet je vaste lasten erin, zoals huur, energie en abonnementen. Per week, per maand of per jaar: de app rekent alles om. Daarna zie je waar je geld heen gaat en waar je kunt besparen.</div></div>';
    h+='<div class="h2"><h2>Met hoeveel zijn jullie?</h2></div>'+huishoudenBlok();
    h+='<div class="h2"><h2>Snel beginnen</h2><span class="r">tik om toe te voegen</span></div><div class="chips">';
    VOORBEELDEN.forEach(function(v,i){h+='<button class="chip voorbeeld" data-act="voorbeeld" data-i="'+i+'">'+ico(v.c,1)+esc(v.n)+'</button>'});
    h+='</div>';
    return h;
  }
  var vp=vastPerCat(), k=ym(today()), ms=maandStaat(k), t=today(), pp=personen();
  var afgeschreven=0,komtNog=0;
  ms.vast.forEach(function(v){if(v.d<=t)afgeschreven+=v.b;else komtNog+=v.b});
  h+='<div class="hero"><div class="k">Vaste lasten per maand</div><div class="v">'+eur(vp.tot)+'</div>'
    + '<div class="s"><span><b>'+eur(vp.tot*12,1)+'</b> per jaar</span><span><b>'+eur(vp.tot*12/52)+'</b> per week</span>'
    + (pp>1?'<span><b>'+eur(vp.tot/pp)+'</b> per persoon</span>':'')+'</div>';
  var ink=+S.hh.inkomen||0;
  if(ink>0){
    var deel=vp.tot/ink, cls=deel>.75?' te':deel>.55?' warn':'';
    h+='<div class="meter'+cls+'"><i style="width:'+Math.min(100,deel*100).toFixed(1)+'%"></i></div>'
      + '<div class="meterlab"><span>'+(S.hideInk?'deel van je inkomen':Math.round(deel*100)+'% van je inkomen')+'</span><span>over: <b class="mono" style="color:var(--sand)">'+eurInk(ink-vp.tot)+'</b></span></div>';
  }
  h+='</div>';

  var tl=tips(), som=0; tl.forEach(function(x){if(!x.weg)som+=x.s});
  if(tl.length){var top=tl[0];
    h+='<button class="toptip" data-act="tab" data-v="besparen">'+ico(top.cat)+'<div class="t"><div class="k">'+(som?'Mogelijk '+eur(som,1)+' per jaar te besparen':'Tip')+'</div><div class="n">'+esc(top.t)+'</div></div>'
      + '<span class="dim">'+svg(P.rechts).replace('<svg','<svg width="20" height="20"')+'</span></button>';
  }

  var bk=binnenkort(14);
  h+='<div class="h2"><h2>De komende twee weken</h2><span class="r">'+eur(bk.reduce(function(a,x){return a+x.b},0))+'</span></div>';
  if(!bk.length)h+='<div class="card"><div class="leeg">Geen afschrijvingen in de komende twee weken.</div></div>';
  else{h+='<div class="card">';
    bk.slice(0,6).forEach(function(x){
      var n=dagenTot(x.d);
      h+='<button class="rij" data-act="post" data-id="'+x.p.id+'">'+ico(x.p.cat)+'<div class="t"><div class="n">'+esc(x.p.naam)+'</div><div class="m">'+(n===0?'vandaag':n===1?'morgen':esc(datum(x.d)))+'</div></div>'
        + '<div class="b"><div class="a">'+eur(x.b)+'</div></div></button>';
    });
    if(bk.length>6)h+='<button class="rij" data-act="tab" data-v="uitgaven"><div class="t"><div class="m" style="color:var(--accent);font-weight:600">nog '+(bk.length-6)+' meer bekijken</div></div></button>';
    h+='</div>';}

  var rij=Object.keys(vp.r).map(function(c){return {c:c,v:vp.r[c]}}).sort(function(a,b){return b.v-a.v});
  if(rij.length){
    h+='<div class="h2"><h2>Waar het heen gaat</h2><span class="r">vaste lasten per maand</span></div><div class="card bars">';
    var max=rij[0].v;
    rij.forEach(function(x){
      h+='<button class="bar" data-act="catvast" data-v="'+x.c+'">'+ico(x.c,1)+'<span class="nm">'+esc(CAT[x.c].n)+'</span>'
        + '<span class="am">'+eur(x.v,1)+'<span class="pc">'+Math.round(x.v/vp.tot*100)+'%</span></span>'
        + '<span class="tr"><i style="width:'+(x.v/max*100).toFixed(1)+'%"></i></span></button>';
    });
    h+='</div>';
  }
  return h;
}

function postRij(p){
  if(ui.opruim)return '<div class="rij'+(actief(p)?'':' uit')+'">'+ico(p.cat)+'<div class="t"><div class="n">'+esc(p.naam)+'</div><div class="m">'+eur(p.bedrag)+' '+esc((FR[p.freq]||FR.maand).k)+'</div></div>'
    + '<button class="weg" data-act="snelweg" data-id="'+p.id+'" aria-label="Verwijderen">'+svg(P.prul)+'</button></div>';
  var f=FR[p.freq]||FR.maand, uit=!actief(p), nv=uit?'':volgende(p);
  var stijg=p.hist&&p.hist.length>1&&p.bedrag>p.hist[p.hist.length-2].b;
  var ts=tijdelijkStand(p);
  var meta=[p.lev,p.freq==='maand'&&p.maanden&&p.maanden.length?p.maanden.length+'× per jaar':f.k,ts?(ts.nog?'nog '+ts.nog+' van '+ts.totaal:'afgelopen'):''].filter(Boolean).join(' · ');
  return '<button class="rij'+(uit?' uit':'')+'" data-act="post" data-id="'+p.id+'">'+ico(p.cat)
    + '<div class="t"><div class="n">'+esc(p.naam)+(uit?'<span class="tag stop">'+(p.gestopt?'opgezegd':'afgelopen')+'</span>':ts?'<span class="tag nog">tijdelijk</span>':'')+'</div><div class="m">'+esc(meta)+(nv?' · '+esc(dagenTot(nv)>300?datum(nv,1):datum(nv)):'')+'</div></div>'
    + '<div class="b"><div class="a'+(stijg?' up':'')+'">'+(stijg?'<span aria-label="duurder geworden">▲ </span>':'')+eur(p.bedrag)+'</div>'
    + (p.freq!=='maand'||p.maanden&&p.maanden.length?'<div class="p">≈ '+eur(perMaand(p))+' p/m</div>':'<div class="p">&nbsp;</div>')+'</div></button>';
}

function vVastPeriode(){
  var per=periode(ui.per||0), st=staatTussen(per.van,per.tot), t=today(), h='', som=0, af=0;
  st.vast.forEach(function(x){som+=x.b;if(x.d<=t)af+=x.b});

/* ───────────────────────────── thuis: de pilaren ─────────────────────────────
   Vier potjes waar je inkomen over verdeeld wordt. Vaste lasten liggen vast;
   geef je bij uitgaven of vervoer te veel uit, dan schuift het tekort eerst
   naar wat er bij de ander over is, en daarna gaat het van sparen af. */
var PIJLERS=[
  {id:'vast',   n:'Vaste lasten', ic:'wonen',   u:'Huur, energie, zorg, verzekeringen, internet, abonnementen',
   cats:['wonen','energie','water','belasting','zorgverz','verzek','internet','mobiel','streaming','sport','kinder','onderwijs','lening','zorg']},
  {id:'uit',    n:'Uitgaven',     ic:'boodsch', u:'Boodschappen, drogist, uit eten, kleding, klussen, uitjes, cadeaus',
   cats:['boodsch','verzorging','huisdier','uiteten','kleding','klus','vakantie','cadeau','goeddoel']},
  {id:'vervoer',n:'Tanken',       ic:'brandstof',u:'Tanken, laden, parkeren, autowas, trein en bus',
   cats:['auto','brandstof','ov']},
  {id:'sparen', n:'Sparen',       ic:'sparen',  u:'Spaaropdrachten en wat je opzijzet',
   cats:['sparen']}
];
var PIJ={}; PIJLERS.forEach(function(x){PIJ[x.id]=x});
/* "overig" als vaste last (bankkosten) is vast; een overige losse uitgave is gewoon een uitgave */
function pijlerVan(cat,isVast){
  if(cat==='overig')return isVast?'vast':'uit';
  for(var i=0;i<PIJLERS.length;i++)if(PIJLERS[i].cats.indexOf(cat)>=0)return PIJLERS[i].id;
  return 'uit';
}
/* Het geld loopt van salaris tot salaris, niet van de 1e tot de 1e.
   Valt de betaaldag in het weekend, dan komt het salaris de vrijdag ervoor. */
function salarisDag(y,m){
  var dim=new Date(y,m+1,0).getDate(), d=new Date(y,m,Math.min(+S.hh.betaaldag||25,dim));
  if(S.hh.weekend!==false){var w=d.getDay();if(w===6)d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-1);else if(w===0)d=new Date(d.getFullYear(),d.getMonth(),d.getDate()-2)}
  return d;
}
function periode(n,op){
  var t=dag(op||today()), y=t.getFullYear(), m=t.getMonth();
  if(t<salarisDag(y,m))m--;
  m+=n||0;
  var van=salarisDag(y,m), vol=salarisDag(y,m+1);
  return {van:iso(van),tot:iso(new Date(vol.getFullYear(),vol.getMonth(),vol.getDate()-1)),volgende:iso(vol),n:n||0};
}
function periodeVan(d){return periode(0,d)}
/* Een periode heet naar de maand waarin je het geld uitgeeft: het salaris van
   25 augustus is je geld voor september (25 aug – 24 sep). */
function salarisNaam(per){var m=dag(per.tot).toLocaleDateString('nl-NL',{month:'long'});return m.charAt(0).toUpperCase()+m.slice(1)+(per.tot.slice(0,4)!==today().slice(0,4)?' '+per.tot.slice(0,4):'')}
function periodeKort(per){function k(d){return dag(d).toLocaleDateString('nl-NL',{day:'numeric',month:'short'}).replace('.','')}return k(per.van)+' – '+k(per.tot)}
function periodeNummer(d){var v=periodeVan(d).van;for(var n=-60;n<=24;n++)if(periode(n).van===v)return n;return 0}
function periodeNaam(per){
  function kort(d){return dag(d).toLocaleDateString('nl-NL',{day:'numeric',month:'long'})}
  return kort(per.van)+' – '+kort(per.tot);
}
/* alles tussen twee dagen, ook als dat over twee maanden loopt */
/* Een vaste last telt één keer per maand, bij de maand waarvoor hij is, ook als
   hij net voor of na je salaris afgaat. Wat vanaf je betaaldag (de 25e) gepland
   staat, hoort bij de periode die dan begint; wat ervoor staat bij de lopende.
   Zo krijgt elke periode precies één Essent, één huur, één zorgverzekering. */
function vastPeriodeVan(p,pl){
  if((FR[p.freq]||FR.maand).d)return periodeVan(echteDag(p,pl)).van;
  var x=dag(pl), m=x.getMonth()-(x.getDate()>=(+S.hh.betaaldag||25)?0:1);
  return iso(salarisDag(x.getFullYear(),m));
}
function staatTussen(van,tot){
  var vast=[],los=[], isPer=periodeVan(van).van===van&&periodeVan(van).tot===tot;
  var ruim1=iso(new Date(dag(van).getTime()-40*86400000)), ruim2=iso(new Date(dag(tot).getTime()+40*86400000));
  S.posten.forEach(function(p){
    if(!isPer){afschrijvingen(p,van,tot).forEach(function(x){vast.push({p:p,d:x.d,b:x.b,pl:x.pl})});return}
    afschrijvingen(p,ruim1,ruim2).forEach(function(x){if(vastPeriodeVan(p,x.pl)===van)vast.push({p:p,d:x.d,b:x.b,pl:x.pl})});
  });
  S.uitgaven.forEach(function(u){if(telt(u)&&u.d>=van&&u.d<=tot)los.push(u)});
  vast.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0});
  return {vast:vast,los:los};
}
/* ───────────────────────────── spaarrekening ─────────────────────────────
   Wat erop gaat en eraf komt. Vaste spaaropdrachten tellen vanzelf mee als
   "erop"; losse overboekingen vul je zelf in (S.spaarMut). Opgenomen geld
   onthoudt de app als "nog terug te zetten" tot je weer iets terugzet. */
function spaarVast(van,tot){
  /* voor het saldo tellen de echte dagen: dat is geld dat echt verschoof */
  var out=[];
  S.posten.forEach(function(p){if(pijlerPost(p)!=='sparen')return;
    afschrijvingen(p,van,tot).forEach(function(x){out.push({d:x.d,b:x.b,soort:'erop',oms:p.naam,vast:true,id:p.id})})});
  return out;
}
function spaarTussen(van,tot){
  var out=spaarVast(van,tot);
  S.spaarMut.forEach(function(m){if(m.d>=van&&m.d<=tot)out.push(m)});
  return out.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0});
}
function spaarNet(lijst){var n=0;lijst.forEach(function(m){n+=m.soort==='eraf'?-m.b:m.b});return n}
function dagErna(d){var x=dag(d);return iso(new Date(x.getFullYear(),x.getMonth(),x.getDate()+1))}
/* saldo op een dag, gerekend vanaf het saldo dat je zelf invulde */
function spaarSaldo(op){
  var r=S.spaarRek; if(r.saldo==null||!r.datum)return null;
  op=op||today();
  if(op>=r.datum)return r.saldo+spaarNet(spaarTussen(dagErna(r.datum),op));
  return r.saldo-spaarNet(spaarTussen(dagErna(op),r.datum));
}
function nogTerug(){
  var open=0, sinds='';
  S.spaarMut.slice().sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0}).forEach(function(m){
    if(m.soort==='eraf'&&m.lenen!==false){if(open<=0)sinds=m.d;open+=m.b}
    else if(m.soort==='erop'){open=Math.max(0,open-m.b);if(!open)sinds=''}
  });
  return {b:open,sinds:sinds};
}

/* inkomen verschilt per maand: per periode in te stellen, anders het standaardbedrag */
function extraVan(per){var e=0;(S.inkExtra||[]).forEach(function(x){if(x.d>=per.van&&x.d<=per.tot)e+=x.b});return e}
function inkomenVan(per){var v=S.inkPer&&S.inkPer[per.van];return (v!=null?+v:(+S.hh.inkomen||0))+extraVan(per)}
function salarisVan(per){var v=S.inkPer&&S.inkPer[per.van];return v!=null?+v:(+S.hh.inkomen||0)}
/* alles wat vast is telt bij de vaste lasten, behalve vaste spaaropdrachten */
/* ───────────────────────────── voorgeschoten ─────────────────────────────
   Wat je voor een ander betaalt (materiaal voor een klus) is niet van jou.
   Het telt niet mee in je cirkels; de app houdt bij wat je nog terugkrijgt. */
var VOOR_BASIS=[{id:'klus',n:'Klussen'},{id:'telefoon',n:'Telefoons'},{id:'vlees',n:'Vlees (samen slachten)'},{id:'ander',n:'Iets anders'}];
function voorLijst(){return S.voorSoorten&&S.voorSoorten.length?S.voorSoorten:VOOR_BASIS}
function voorNaam(k){var x=voorLijst().filter(function(v){return v.id===k})[0];return x?x.n:'iets anders'}
var VOORNAAM=new Proxy({},{get:function(o,k){return voorNaam(k).toLowerCase()}});
/* Boodschappen via de ING-rekening staan er op twee manieren in: als overboeking
   vanaf de Rabobank (u.ingOver) en, als je het ING-afschrift inleest, als losse
   betalingen (u.bron='ing'). Er telt er altijd maar één mee: wat je kiest. */
function ingAfschrift(){return S.ing&&S.ing.modus==='afschrift'}
function telt(u){
  if(u.voor)return false;
  if(u.ingOver&&ingAfschrift())return false;
  if(u.bron==='ing'&&!ingAfschrift())return false;
  return true;
}
function voorSoort(v){return v===true?'klus':v}
function voorStand(soort){
  var v=0,t=0;
  S.uitgaven.forEach(function(u){if(u.voor&&(!soort||voorSoort(u.voor)===soort))v+=u.b});
  (S.terug||[]).forEach(function(x){if(!soort||(x.voor||'klus')===soort)t+=x.b});
  return {voor:v,terug:t,open:Math.max(0,v-t)};
}
/* een voorgeschoten uitgave is betaald als er een terugbetaling aan hangt */
function betaaldVan(u){return (S.terug||[]).filter(function(x){return x.voorId===u.id})[0]||null}
function zetBetaald(u,hoe){
  if(betaaldVan(u))return;
  S.terug=S.terug||[];
  var x={id:uid(),voorId:u.id,d:today(),b:u.b,oms:u.oms||CAT[u.cat].n,hoe:hoe||'contant',voor:voorSoort(u.voor)};
  if(u.wie)x.wie=u.wie;
  S.terug.push(x);
}
function voorRij(u){

    + '<div class="m">'+esc(datum(u.d))+(u.wie?' · '+esc(u.wie):'')+(bt?' · <span style="color:var(--accent)">terug op '+esc(datum(bt.d))+'</span>':'')+'</div></button>'
    + '<div class="b" style="margin-right:8px"><div class="a" style="font-size:14px;'+(bt?'color:var(--dim);text-decoration:line-through':'')+'">'+eur(u.b)+'</div></div>'
    + (bt?'<button class="chip" data-act="voorterug" data-id="'+u.id+'" style="padding:7px 10px">↺ Toch niet</button>'
         :'<button class="chip" data-act="voorbetaald" data-id="'+u.id+'" style="padding:7px 10px;border-color:var(--accent);color:var(--accent)">✓ Betaald</button>')+'</div>';
}
function voorSoortForm(k){
  var x=voorStand(k), h=kop(voorNaam(k));
  var lijst=S.uitgaven.filter(function(u){return u.voor&&voorSoort(u.voor)===k}).sort(function(a,b){return a.d<b.d?1:-1});
  var open=lijst.filter(function(u){return !betaaldVan(u)}), dicht=lijst.filter(function(u){return betaaldVan(u)});
  var los=(S.terug||[]).filter(function(t){return !t.voorId&&(t.voor||'klus')===k}), lb=0; los.forEach(function(t){lb+=t.b});
  h+='<button class="chip" data-act="voorsoort" data-v="" style="margin-bottom:6px">‹ Alle soorten</button>';
  h+='<div class="drie2"><div class="regel"><div class="k">Voorgeschoten</div><div class="v">'+eur(x.voor,1)+'</div></div>'

function pijlerPost(p){return p.pijler||(p.cat==='sparen'?'sparen':'vast')}
function pijlerStaat(per){
  var t=today(), ms=staatTussen(per.van,per.tot), ink=inkomenVan(per), voorbij=per.tot<t;
  var r={}; PIJLERS.forEach(function(x){r[x.id]={p:x,gepland:0,gedaan:0,los:0,items:[]}});
  ms.vast.forEach(function(v){var q=r[pijlerPost(v.p)];q.gepland+=v.b;var af=voorbij||v.d<=t;if(af)q.gedaan+=v.b;
    q.items.push({soort:'vast',d:v.d,b:v.b,naam:v.p.naam,cat:v.p.cat,id:v.p.id,af:af,bev:bevestigd(v.p,v.pl)})});
  ms.los.forEach(function(u){var q=r[pijlerVan(u.cat,false)];q.los+=u.b;q.gedaan+=u.b;
    q.items.push({soort:'los',d:u.d,b:u.b,naam:u.oms||CAT[u.cat].n,cat:u.cat,id:u.id,af:true})});
  S.spaarMut.forEach(function(m){if(m.d<per.van||m.d>per.tot)return;var v=m.soort==='eraf'?-m.b:m.b;r.sparen.gedaan+=v;
    r.sparen.items.push({soort:'spaar',d:m.d,b:v,naam:m.oms||(m.soort==='eraf'?'Noodgreep':'Erop gezet'),cat:'sparen',id:m.id,af:true})});
  r.sparen.items.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0});
  var vast=r.vast.gepland;
  var spaarDoel=Math.max(r.sparen.gepland,ink*(S.spaar||10)/100);
  var vervB=ink*.10;
  var uitB=ink-vast-vervB-spaarDoel, krap=false;
  if(uitB<0){krap=true;uitB=0}
  var B={vast:vast,uit:uitB,vervoer:vervB,sparen:spaarDoel}, basis={vast:vast,uit:uitB,vervoer:vervB,sparen:spaarDoel};
  var schuif=[];
  /* te veel bij de een: eerst van de ruimte bij de ander, dan van sparen */
  [['vervoer','uit'],['uit','vervoer']].forEach(function(pr){
    var a=pr[0],o=pr[1], teveel=r[a].gedaan-B[a];
    if(teveel<=0)return;
    var ruimte=Math.max(0,B[o]-r[o].gedaan), x=Math.min(teveel,ruimte);
    if(x>0){B[o]-=x;B[a]+=x;teveel-=x;schuif.push({van:o,naar:a,b:x})}
    var sp=Math.max(0,B.sparen-Math.max(0,r.sparen.gedaan)), y=Math.min(teveel,sp);
    if(y>0){B.sparen-=y;B[a]+=y;teveel-=y;schuif.push({van:'sparen',naar:a,b:y})}
  });
  PIJLERS.forEach(function(x){var q=r[x.id];q.budget=B[x.id];q.basis=basis[x.id];q.pct=q.gedaan<=0?0:q.budget?q.gedaan/q.budget:1;
    q.items.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0})});
  /* geld van de spaarrekening halen is geen inkomen maar een noodgreep:
     het maakt je budget niet groter en telt niet mee als "over" */
  var totGedaan=0;PIJLERS.forEach(function(x){totGedaan+=x.id==='sparen'?Math.max(0,r[x.id].gedaan):r[x.id].gedaan});
  var nood=0;S.spaarMut.forEach(function(m){if(m.soort==='eraf'&&m.d>=per.van&&m.d<=per.tot)nood+=m.b});
  /* wat een huishouden van deze grootte ongeveer aan boodschappen kwijt is */
  var A=Math.max(1,+S.hh.volw||1),K=+S.hh.kind||0, bsNorm=A*290+K*190, bs=0;
  r.uit.items.forEach(function(it){if(it.cat==='boodsch')bs+=it.b});
  return {per:per,r:r,ink:ink,schuif:schuif,krap:krap,over:ink-totGedaan,voorbij:voorbij,nood:nood,bs:bs,bsNorm:bsNorm};
}
function ring(pct,size,cls,inner){
  var sw=size>150?14:10, rr=(size-sw)/2, c=2*Math.PI*rr, v=Math.max(0,Math.min(1,pct));
  return '<div class="ring '+cls+'" style="width:'+size+'px;height:'+size+'px"><svg viewBox="0 0 '+size+' '+size+'" width="'+size+'" height="'+size+'" aria-hidden="true">'
    + '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+rr+'" fill="none" stroke="var(--surface2)" stroke-width="'+sw+'"/>'
    + (v>0?'<circle class="rv" cx="'+size/2+'" cy="'+size/2+'" r="'+rr+'" fill="none" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+(c*v).toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>':'')

function pijlerKlasse(id,q,schuif){

  if(id==='sparen')return q.gedaan<0?'te':'ok';
  if(id==='vast')return 'ok';
  return q.pct>1.001?'te':q.pct>.9?'warn':'ok';

function pijlerRegel(id,q,schuif){

/* de afschrijving die het dichtst bij de gekozen dag ligt, krijgt die dag */
function dichtsteKeer(p,D){
  var best="",afst=Infinity,k=schuifMaand(ym(D),-1);
  for(var i=0;i<3;i++){keren(p,k).forEach(function(pl){var a=Math.abs(dag(pl)-dag(D));if(a<=afst){afst=a;best=pl}});k=schuifMaand(k,1)}
  return best;
}
function zetAfgeschreven(){
  var d=ui.draft, p=S.posten.filter(function(x){return x.id===d.id})[0], D=d.afd||today();
  if(!p)return;
  if(d.afVast&&(FR[p.freq]||FR.maand).m){
    /* de dag in de maand verschuiven; de maand waarin hij begon blijft gelijk */
    var st=dag(p.start), dim=new Date(st.getFullYear(),st.getMonth()+1,0).getDate();
    p.start=p.start.slice(0,8)+pad(Math.min(+D.slice(8,10),dim)); d.start=p.start;
    if(p.hist&&p.hist.length&&p.hist[0].d>p.start)p.hist[0].d=p.start;
  }
  var pl=d.afPl&&!d.afVast?d.afPl:dichtsteKeer(p,D);
  if(!pl){d.afMelding='Rond die dag hoort geen afschrijving van '+p.naam+'. Kies een dag dichter bij de gewone afschrijfdag.';herteken();return}
  var was=bevestigd(p,pl)&&p.afw[pl]===D;
  p.afw=p.afw||{}; p.afw[pl]=D;
  d.afOpen=false; d.afPl=''; save();
  d.afMelding=(was?'Stond er al: ':'✓ ')+p.naam+' van '+datum(D)+' ('+eur(bedragOp(p,pl))+') telt mee bij '+salarisNaam(periodeVan(D)).toLowerCase()+' ('+periodeKort(periodeVan(D))+').';
  render(); herteken();
}

function bewaarPost(kopie){
  leesPostForm();
  var d=ui.draft, b=getal(d.bedragTxt);
  if(!d.naam.trim()){alert('Geef het een naam.');return}
  if(!(b>=0)||isNaN(b)){alert('Dat bedrag snap ik niet. Typ bijvoorbeeld 12,50');return}
  if(!d.start)d.start=today();
  var p=d.id&&!kopie?S.posten.filter(function(x){return x.id===d.id})[0]:null;
  if(p){
    if(Math.abs(p.bedrag-b)>.004){
      p.hist=p.hist&&p.hist.length?p.hist:[{d:p.start,b:p.bedrag}];
      var t=today(); if(p.hist[p.hist.length-1].d===t)p.hist[p.hist.length-1].b=b;else p.hist.push({d:t,b:b});
      if(p.hist.length>1&&p.hist[p.hist.length-1].b===p.hist[p.hist.length-2].b)p.hist.pop();
    }
    if(p.start!==d.start&&p.hist&&p.hist.length&&p.hist[0].d>d.start)p.hist[0].d=d.start;
    p.naam=d.naam.trim();p.bedrag=b;p.freq=d.freq;p.cat=d.cat;p.start=d.start;p.eind=d.eind;p.lev=d.lev.trim();p.notitie=d.notitie;p.gestopt=d.gestopt||'';p.bewust=!!d.bewust;
    if(d.pijler)p.pijler=d.pijler;else delete p.pijler;
    if(d.aantal)p.aantal=d.aantal;else delete p.aantal;
    if(d.freq==='maand'&&d.maanden&&d.maanden.length)p.maanden=d.maanden.slice().sort(function(a,b){return a-b});else delete p.maanden;
    ui.msg='Bewaard.';
  }else{
    S.posten.push({id:uid(),naam:d.naam.trim()+(kopie?' (kopie)':''),bedrag:b,freq:d.freq,cat:d.cat,start:d.start,eind:kopie?'':d.eind,lev:d.lev.trim(),notitie:d.notitie,gestopt:'',hist:[{d:d.start,b:b}]});
    var np=S.posten[S.posten.length-1];
    if(d.freq==='maand'&&d.maanden&&d.maanden.length)np.maanden=d.maanden.slice().sort(function(a,b){return a-b});

function jaarData(j){
  var nu=ym(today()), maanden=[], perCat={}, tv=0, tl=0, perPost={};
  for(var m=1;m<=12;m++){
    var k=j+'-'+pad(m), st=maandStaat(k), toek=k>nu;
    maanden.push({k:k,tv:st.tv,tl:st.tl,toek:toek});
    if(!toek){tv+=st.tv;tl+=st.tl;for(var c in st.perCat)perCat[c]=(perCat[c]||0)+st.perCat[c];
      st.vast.forEach(function(x){perPost[x.p.id]=(perPost[x.p.id]||0)+x.b})}
  }
  var n=maanden.filter(function(x){return !x.toek&&(x.tv||x.tl)}).length;
  return {j:j,maanden:maanden,perCat:perCat,tv:tv,tl:tl,n:n,perPost:perPost};
}

}

function zetTerug(tekst){
  var d;
  try{d=JSON.parse(tekst)}catch(e){alert('Dit is geen back-up van het Huishoudboek.');return}
  if(!d||!Array.isArray(d.posten)){alert('Dit is geen back-up van het Huishoudboek.');return}
  vraag('Back-up terugzetten?','Wat nu in de app staat wordt vervangen door de back-up: '+d.posten.length+' vaste lasten en '+(d.uitgaven||[]).length+' uitgaven. Er wordt eerst een herstelpunt gemaakt.','Terugzetten',function(){
    if(S.posten.length||S.uitgaven.length){
      S.snaps.unshift({dag:today(),n:S.posten.length,u:S.uitgaven.length,data:backupTekst()});S.snaps=S.snaps.slice(0,5);
    }
    S.posten=d.posten; S.uitgaven=Array.isArray(d.uitgaven)?d.uitgaven:[];
    S.spaarRek=d.spaarRek||{naam:'Spaarrekening',saldo:null,datum:''}; S.spaarMut=Array.isArray(d.spaarMut)?d.spaarMut:[]; S.terug=Array.isArray(d.terug)?d.terug:[];
    if(Array.isArray(d.eigenCats))S.eigenCats=d.eigenCats; if(Array.isArray(d.voorSoorten))S.voorSoorten=d.voorSoorten; if(d.leer)S.leer=d.leer; if(Array.isArray(d.doelen))S.doelen=d.doelen; if(d.ing)S.ing=d.ing; zetEigenCats();
    var ink=+S.hh.inkomen||0;
    if(d.hh)S.hh=Object.assign({volw:1,kind:0,woning:'huur'},d.hh);
    S.hh.inkomen=ink; /* wat je op dit toestel instelde, blijft staan */
    S.tipsWeg=d.tipsWeg||{}; S.begonnen=true;
    if(typeof d.pin==='string')S.pin=d.pin;
    if(d.spaar)S.spaar=+d.spaar;
    ui.msg='Teruggezet: '+S.posten.length+' vaste lasten en '+S.uitgaven.length+' uitgaven.';
    save(); closeSheet(); render();
  });
}

/* ───────────────────────────── afschrift inlezen ─────────────────────────────
   Een Rabobank-afschrift (PDF) of export (CSV) wordt op het toestel zelf gelezen.
   pdf.js staat naast de app en wordt door de service worker bewaard, dus het
   werkt ook zonder internet. Niets gaat naar buiten. */
function laadPdfjs(cb){
  if(window.pdfjsLib){cb(true);return}
  var sc=document.createElement('script'); sc.src='pdf.min.js';
  sc.onload=function(){try{pdfjsLib.GlobalWorkerOptions.workerSrc='pdf.worker.min.js'}catch(e){}cb(!!window.pdfjsLib)};
  sc.onerror=function(){cb(false)};
  document.head.appendChild(sc);
}
var BEDRAG_RX=/^\d{1,3}(\.\d{3})*,\d{2}$/;
function leesPdfRegels(buf,cb){
  laadPdfjs(function(ok){
    if(!ok){cb(null,'Het leesprogramma voor PDF kon niet laden. Open de app één keer met internet, daarna werkt het ook zonder.');return}
    pdfjsLib.getDocument({data:buf}).promise.then(function(doc){
      var regels=[],i=0;
      (function volgende(){
        i++; if(i>doc.numPages){cb(regels);return}
        doc.getPage(i).then(function(pg){return pg.getTextContent()}).then(function(tc){
          var rijen=[];
          tc.items.forEach(function(it){
            var t=(it.str||'').trim(); if(!t)return;
            var x=it.transform[4], y=it.transform[5], rij=null;
            for(var k=0;k<rijen.length;k++)if(Math.abs(rijen[k].y-y)<2.5){rij=rijen[k];break}
            if(!rij){rij={y:y,it:[]};rijen.push(rij)}
            rij.it.push({x:x,s:t});
          });
          rijen.sort(function(a,b){return b.y-a.y}).forEach(function(r){regels.push(r.it.sort(function(a,b){return a.x-b.x}))});
          volgende();
        }).catch(function(){cb(null,'Een bladzijde van de PDF kon niet gelezen worden.')});
      })();
    }).catch(function(){cb(null,'Dit lijkt geen leesbare PDF.')});
  });
}
function pdfNaarTransacties(regels){
  var data=[], tx=[], cur=null, kop=false;
  regels.forEach(function(r){
    var bedragen=r.filter(function(it){return it.x>380&&BEDRAG_RX.test(it.s)});
    var txt=r.filter(function(it){return !(it.x>380&&BEDRAG_RX.test(it.s))}).map(function(it){return it.s}).join(' ').replace(/\s+/g,' ').trim();
    (txt.match(/\d\d-\d\d-20\d\d/g)||[]).forEach(function(m){data.push(m)});
    if(/^(Blad|vervolg Rekeningafschrift)/.test(txt)){kop=true;return}
    /* bovenaan elke bladzijde staan naam en adres: overslaan tot de kolomkop "datum" */
    if(kop){if(/^datum\b/.test(txt))kop=false;return}
    if(/^(ba|bc|bg|bv|cb|cc) = /.test(txt)){cur=null;return}
    var m=txt.match(/^(\d\d)-(\d\d) ([a-z]{2})\b ?(.*)$/);
    if(m&&bedragen.length){cur={dd:+m[1],mm:+m[2],typ:m[3],kop:m[4]||'',extra:[],b:getal(bedragen[0].s),af:bedragen[0].x<480};tx.push(cur);return}
    if(cur&&txt&&!/^(Verwerkingsdatum|\. Pas|Pas:|Appr|Transactiereferentie|Kenmerk machtiging|xxx|5xxx|ppr Cd|NOTPROVIDED)/i.test(txt))cur.extra.push(txt);
  });
  /* het jaar: de vroegste volledige datum bovenaan is "datum vanaf" */
  var vanaf=data.map(function(d){var p=d.split('-');return p[2]+'-'+p[1]+'-'+p[0]}).sort()[0]||today();
  var jaar=+vanaf.slice(0,4), startM=+vanaf.slice(5,7);
  return tx.map(function(t){
    var y=t.mm<startM?jaar+1:jaar, kopTekst=t.kop;
    var im=kopTekst.match(/^([A-Z]{2}\d{2} [A-Z0-9]{4}(?: \d{4}){2,3}(?: \d{1,4})?)\s*(.*)$/);
    var iban=im?im[1].replace(/\s/g,''):'', naam=(im?im[2]:kopTekst)||t.extra[0]||'';
    return {d:y+'-'+pad(t.mm)+'-'+pad(t.dd),b:t.b,af:t.af,typ:t.typ,iban:iban,naam:naam.trim(),tekst:(kopTekst+' '+t.extra.join(' ')).trim()};
  });
}
/* ING: "Datum","Naam / Omschrijving","Rekening","Tegenrekening","Code","Af Bij","Bedrag (EUR)",... */
function leesIngCsv(rijen,k){
  var ix=function(n){return k.indexOf(n)}, iD=ix('datum'),iN=ix('naam / omschrijving'),iR=ix('rekening'),iT=ix('tegenrekening'),iC=ix('code'),iA=ix('af bij'),iB=ix('bedrag (eur)'),iM=ix('mededelingen'),iS=ix('mutatiesoort');
  var eigen=rijen.length&&iR>=0?(rijen[0][iR]||'').replace(/\s/g,''):'';
  if(eigen){S.ing=S.ing||{modus:'overboeking'};if(!S.ing.iban)S.ing.iban=eigen}
  return rijen.map(function(r){
    var dd=(r[iD]||'').replace(/\D/g,''); if(dd.length!==8)return null;
    var b=Math.abs(getal(r[iB]||''));
    return {d:dd.slice(0,4)+'-'+dd.slice(4,6)+'-'+dd.slice(6,8),b:b,af:/^af/i.test(r[iA]||''),typ:(iS>=0&&/incasso/i.test(r[iS]||''))?'ei':((r[iC]||'').toLowerCase()==='gm'?'ga':'bc'),
      iban:iT>=0?(r[iT]||'').replace(/\s/g,''):'',naam:r[iN]||'',tekst:((r[iN]||'')+' '+(iM>=0?r[iM]:'')).trim(),bron:'ing'};
  }).filter(function(t){return t&&t.b>0});
}
function leesCsv(tekst){
  var rijen=[],rij=[],veld='',q=false;
  for(var i=0;i<tekst.length;i++){var c=tekst[i];
    if(q){if(c==='"'){if(tekst[i+1]==='"'){veld+='"';i++}else q=false}else veld+=c}
    else if(c==='"')q=true;else if(c===','||c===';'){rij.push(veld);veld=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&tekst[i+1]==='\n')i++;rij.push(veld);veld='';if(rij.length>1)rijen.push(rij);rij=[]}
    else veld+=c}
  if(veld||rij.length){rij.push(veld);if(rij.length>1)rijen.push(rij)}
  if(!rijen.length)return null;
  var k=rijen.shift().map(function(h){return h.trim().toLowerCase()}), ix=function(n){return k.indexOf(n)};
  if(ix('af bij')>=0&&ix('bedrag (eur)')>=0)return leesIngCsv(rijen,k);
  var iD=ix('datum'),iB=ix('bedrag'),iI=ix('tegenrekening iban/bban'),iN=ix('naam tegenpartij'),iC=ix('code'),iO=[ix('omschrijving-1'),ix('omschrijving-2'),ix('omschrijving-3')];
  if(iD<0||iB<0)return null;
  return rijen.map(function(r){
    var bt=(r[iB]||'').trim(), b=Math.abs(getal(bt.replace('+','')));
    var oms=iO.filter(function(i){return i>=0}).map(function(i){return r[i]||''}).join(' ').trim();
    return {d:(r[iD]||'').slice(0,10),b:b,af:/^-/.test(bt),typ:iC>=0?(r[iC]||'').toLowerCase():'',iban:iI>=0?(r[iI]||'').replace(/\s/g,''):'',naam:iN>=0?(r[iN]||''):'',tekst:((iN>=0?r[iN]:'')+' '+oms).trim()};
  }).filter(function(t){return /^\d{4}-\d\d-\d\d$/.test(t.d)&&t.b>0});
}

function naamSleutel(t){
  if(t.iban&&/^(ei|bg|tb|sb|cb|db)$/.test(t.typ)&&!/ABNA0506417344/.test(t.iban))return t.iban;
  var n=String(t.naam||t.tekst).toLowerCase().replace(/^(bck|ccv|zettle_|sumup|paypal_)\s*\*\s*/,'').replace(/ via .*/,'');
  return n.split(/\s+/).filter(function(w){return w&&!/\d/.test(w)}).slice(0,2).join(' ');
}
function wieUit(t){return String(t.naam||'').replace(/ via .*/i,'').replace(/Rabo Betaalverzoek/i,'').trim()}
/* hoe deelde je deze winkel of persoon de vorige keer in? */
function uitGeschiedenis(t){
  var w=naamSleutel(t).split(' ')[0]; if(!w||w.length<3||/^[A-Z]{2}\d/.test(w))return '';
  var u=S.uitgaven.filter(function(x){return (x.oms||'').toLowerCase().indexOf(w)===0}).sort(function(a,b){return a.d<b.d?1:-1})[0];
  if(!u)return '';
  return u.voor?'voor:'+u.voor+':'+u.cat:'los:'+u.cat+(u.oms&&u.oms.toLowerCase().indexOf(w)===0&&u.oms.length>w.length+2?':'+u.oms:'');
}
function heelWoord(tx,w){var i=tx.indexOf(w);while(i>=0){var a=tx.charAt(i-1),b=tx.charAt(i+w.length);if(!/[a-z]/.test(a)&&!/[a-z]/.test(b))return true;i=tx.indexOf(w,i+1)}return false}
function vindPost(t,gebruikt){
  var tx=t.tekst.toLowerCase(), kand=S.posten.filter(function(p){
    if(p.gestopt&&p.gestopt<=t.d)return false;
    if(p.iban&&t.iban)return p.iban===t.iban;
    var w=(p.lev||'').toLowerCase();
    if(w.length>=2&&heelWoord(tx,w))return true;
    return false;
  }).filter(function(p){return Math.abs(p.bedrag-t.b)<=Math.max(0.5,p.bedrag*0.35)});
  kand.sort(function(a,b){return Math.abs(a.bedrag-t.b)-Math.abs(b.bedrag-t.b)});
  for(var i=0;i<kand.length;i++){var pl=dichtsteKeer(kand[i],t.d);if(pl&&!gebruikt[kand[i].id+pl])return {p:kand[i],pl:pl}}
  return null;
}
function standaardKeuze(t,gebruikt){
  var k=naamSleutel(t), geleerd=S.leer&&S.leer[k];
  /* overboekingen tussen je Rabo- en ING-rekening */
  if(t.bron==='ing'&&/NL\d\dRABO/.test(t.iban||'')&&!t.af)return 'negeer';
  if(t.bron!=='ing'&&S.ing&&S.ing.iban&&t.iban===S.ing.iban&&t.af)return 'los:boodsch:Naar ING (grote boodschappen)';
  if(!t.af){
    if(t.typ==='sb'||/salaris/i.test(t.tekst))return 'ink';
    if(/\b(uwv|svb|kinderbijslag|kindgebonden|zorgtoeslag|huurtoeslag)\b/i.test(t.tekst))return 'extra';
    var tg=(S.terug||[]).filter(function(x){return x.d===t.d&&Math.abs(x.b-t.b)<0.005})[0]; if(tg)return 'terug:'+(tg.voor||'klus');
    var ex=(S.inkExtra||[]).filter(function(x){return x.d===t.d&&Math.abs(x.b-t.b)<0.005})[0]; if(ex)return 'extra';
    if(t.typ==='tb'||(S.spaarRek.iban&&t.iban===S.spaarRek.iban))return 'spaar:eraf';
    if(geleerd&&!/^(los|voor|vast|nieuwvast)/.test(geleerd))return geleerd;
    return 'negeer';
  }
  var vp=vindPost(t,gebruikt); if(vp){gebruikt[vp.p.id+vp.pl]=1;t.post=vp;return 'vast:'+vp.p.id}
  if(t.typ==='tb'||(S.spaarRek.iban&&t.iban===S.spaarRek.iban))return 'spaar:erop';
  if(geleerd&&/^(los|voor|negeer|spaar)/.test(geleerd))return geleerd;
  var eerder=uitGeschiedenis(t); if(eerder)return eerder;
  /* alleen de naam: in de omschrijving staat bij elke pinbetaling "Apple Pay" */
  var catTekst=(t.typ==='ei'||!t.naam?t.naam+' '+t.tekst:t.naam).replace(/apple pay.*/i,'');
  if(t.typ==='ei')return 'nieuwvast';
  var cat=raadCat(catTekst)||'overig';
  if(cat==='klus')return 'voor:klus:klus';
  if(/iphone|telefoon|samsung|marktplaats/i.test(t.tekst))return 'voor:telefoon:overig';
  return 'los:'+cat;
}
function isDubbel(t,keuze){
  var a=keuze.split(':');
  if(a[0]==='vast'){var p=t.post&&t.post.p;return !!(p&&p.afw&&p.afw[t.post.pl]===t.d)}

  if(a[0]==='spaar')return S.spaarMut.some(function(m){return m.d===t.d&&Math.abs(m.b-t.b)<0.005})||spaarVast(t.d,t.d).some(function(m){return Math.abs(m.b-t.b)<0.005});
  if(a[0]==='terug')return (S.terug||[]).some(function(x){return x.d===t.d&&Math.abs(x.b-t.b)<0.005});
  if(a[0]==='ink')return Math.abs((S.inkPer[periodeVan(t.d).van]||0)-t.b)<0.005;
  if(a[0]==='extra')return (S.inkExtra||[]).some(function(x){return x.d===t.d&&Math.abs(x.b-t.b)<0.005});

var pinBuf='', pinMode=null, pinFirst='', locked=false;
function hashPin(p){var h=5381;for(var i=0;i<p.length;i++)h=((h<<5)+h+p.charCodeAt(i))>>>0;return String(h)}
function lockScreen(kop,sub){
  var h='<div class="lockscreen"><div class="lg">'+esc(kop)+'</div><div class="ls">'+esc(sub)+'</div>'
   + '<div class="dots" id="dots">'+[0,1,2,3].map(function(){return '<div class="dot"></div>'}).join('')+'</div><div class="keys">';
  [1,2,3,4,5,6,7,8,9].forEach(function(n){h+='<button class="key" data-act="pin" data-n="'+n+'">'+n+'</button>'});
  h+='<button class="key wide" data-act="pinuit">'+(pinMode?'Annuleer':'')+'</button><button class="key" data-act="pin" data-n="0">0</button>'
   + '<button class="key wide" data-act="pinweg" aria-label="Wis">←</button></div></div>';
  document.getElementById('lock').innerHTML=h; tekenDots();
}
function tekenDots(){var d=document.getElementById('dots');if(!d)return;
  Array.prototype.forEach.call(d.children,function(el,i){el.classList.toggle('on',i<pinBuf.length)})}
function pinKlaar(){
  var dots=document.getElementById('dots');
  if(pinMode==='nieuw1'){pinFirst=pinBuf;pinBuf='';pinMode='nieuw2';lockScreen('Pincode','Typ dezelfde code nog een keer');return}
  if(pinMode==='nieuw2'){
    if(pinBuf===pinFirst){S.pin=hashPin(pinBuf);save();pinBuf='';pinMode=null;document.getElementById('lock').innerHTML='';ui.msg='De pincode staat aan.';render();herteken();return}
    pinBuf='';pinMode='nieuw1';pinFirst='';lockScreen('Pincode','Die codes waren niet gelijk. Kies opnieuw.');return;
  }
  if(hashPin(pinBuf)===S.pin){locked=false;pinBuf='';document.getElementById('lock').innerHTML='';render();return}
  pinBuf='';
  if(dots){dots.classList.add('bad');dots.parentNode.classList.add('shake');
    setTimeout(function(){var d2=document.getElementById('dots');if(d2){d2.classList.remove('bad');d2.parentNode.classList.remove('shake');tekenDots()}},420)}
}
function opSlot(){if(!S.pin)return;locked=true;if(ui.sheet)closeSheet();pinBuf='';pinMode=null;lockScreen('Huishoudboek','Typ je pincode')}

document.addEventListener('visibilitychange',function(){
